[project]
name = "debinfra"
version = "0.1.0"
description = "Provisioning for my Debian machines, powered by pyinfra"
requires-python = ">=3.11"
dependencies = [
    "pyinfra>=3.2,<4",
    "typer>=0.12",
    "packaging>=24.0",
    "pyyaml>=6.0",
]

[project.scripts]
debinfra = "debinfra.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["debinfra"]
