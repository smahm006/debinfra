### -- Apps --------------------------------------------------------------------
bindsym $mod+Shift+q kill
bindsym $mod+f       exec firefox
bindsym $mod+e       exec emacsclient -c -n -a ""
bindsym $mod+t       exec thunar
bindsym $mod+0       exec ~/.config/sway/scripts/powermenu.sh
bindsym $mod+n       exec swaync-client -t -sw

### -- Terminal ----------------------------------------------------------------
bindsym $mod+Return exec ~/.config/sway/scripts/dropdown.sh
bindsym $mod+Shift+Return exec foot

### -- Menu --------------------------------------------------------------------
bindsym $mod+d       exec rofi -show drun -run-command "swaymsg exec -- {cmd}"
bindsym $mod+Shift+d exec rofi -show drun -run-command "swaymsg exec \"SUDO_ASKPASS=$HOME/.config/sway/scripts/askpass_rofi.sh sudo -E -A {cmd}\""
bindsym $mod+c       exec cliphist list | rofi -dmenu -i -p "󰅍 " -display-columns 2 | cliphist decode | wl-copy
bindsym $mod+Shift+c exec cliphist wipe

### -- Workspaces --------------------------------------------------------------
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9

### -- Focus -------------------------------------------------------------------
bindsym $mod+Left      focus left
bindsym $mod+Down      focus down
bindsym $mod+Up        focus up
bindsym $mod+Right     focus right
bindsym $mod+Tab       focus right
bindsym $mod+Shift+Tab focus left

### -- Move --------------------------------------------------------------------
bindsym $mod+Shift+Left  move left
bindsym $mod+Shift+Down  move down
bindsym $mod+Shift+Up    move up
bindsym $mod+Shift+Right move right

### -- Layout ------------------------------------------------------------------
bindsym $mod+u           fullscreen toggle
bindsym $mod+h           splith
bindsym $mod+v           splitv
bindsym $mod+space       layout toggle split
bindsym $mod+Shift+space floating toggle

### -- Screenshot --------------------------------------------------------------
bindsym Print            exec grimshot copy area
bindsym $mod+Print       exec grimshot save area ~/media/images/screenshot/$(date +"%Y-%m-%d-%H-%M-%S").png
bindsym $mod+Shift+Print exec grimshot save screen ~/media/images/screenshot/$(date +"%Y-%m-%d-%H-%M-%S").png

### -- Volume ------------------------------------------------------------------
bindsym XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +5%
bindsym XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -5%
bindsym XF86AudioMute        exec pactl set-sink-mute   @DEFAULT_SINK@ toggle

### -- Brightness --------------------------------------------------------------
bindsym XF86MonBrightnessUp   exec brightnessctl set +10%
bindsym XF86MonBrightnessDown exec brightnessctl set 10%-

### -- Session -----------------------------------------------------------------
bindsym $mod+l       exec swayexit lock
bindsym $mod+Shift+r reload
bindsym $mod+Shift+x mode "xkill"
mode "xkill" {
  bindsym --whole-window button1 kill
  bindsym Escape mode "default"
  bindsym Return mode "default"
}
